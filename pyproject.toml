[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structflow-eval"
version = "0.1.0"
authors = [
    { name = "Zhangyiqian218", email = "zyqctj218@163.com" },
]
description = "A rigorous, human-in-the-loop evaluation and distillation framework for LLM nested JSON extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["medical-nlp", "information-extraction", "llm-evaluation", "pydantic", "clinical-text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Zhangyiqian218/StructFlow-MedicalEval"
Repository = "https://github.com/Zhangyiqian218/StructFlow-MedicalEval"

[tool.setuptools.packages.find]
# 仅将核心源码包打入发行物；ui/（streamlit 脚本）、根目录 phase*.py（流水线入口）
# 与 data/（语料）随仓库分发，不打进 wheel，避免自动发现误报多顶层包
include = ["structflow*"]
